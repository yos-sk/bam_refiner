name: Publish Docker image

on:
  release:
    types: [published]
  # Manual re-run for an already published tag, e.g. after a transient failure.
  workflow_dispatch:
    inputs:
      version:
        description: Git tag to build and push (e.g. v0.4.0)
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Only needed for the Dockerfile itself; the source it builds is cloned
      # inside the image from the VERSION passed below.
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        # PRCGAP pulls docker://yosakam2/bam_refiner:<tag> with the
        # leading "v", so the image tag is the git tag verbatim.
        with:
          images: yosakam2/bam_refiner
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.event.release.tag_name || inputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}

      - uses: docker/login-action@v3
        with:
          username: yosakam2
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # amd64 only: the prebuilt minimap2/meryl binaries are x86_64 and building
      # samtools/rust under QEMU emulation for arm64 would take hours.
      - uses: docker/build-push-action@v6
        with:
          context: .
          # The Dockerfile clones this tag rather than using the build context,
          # so the tag must exist on GitHub before the build runs.
          build-args: |
            VERSION=${{ github.event.release.tag_name || inputs.version }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
